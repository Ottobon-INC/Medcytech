version: '3.8'

services:
  medcy-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    container_name: medcy-web
    ports:
      - "3050:3050"
    restart: always
    environment:
      - NODE_ENV=production
